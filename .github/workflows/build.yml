name: Build application on commit
on:
  workflow_call:
  pull_request:
  push:
    paths:
      - '**'
    branches:
      - '**'

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          # package.json declares engines.node >= 24. Jest also needs Node 24.9+
          # to require the ESM-only tslog; on Node 22 four suites fail to run.
          node-version: 24
      - name: Check yarn version
        run: yarn --version
      - name: Install dependencies
        run: yarn install
      - name: Run tests
        run: yarn run test
      - name: Build application
        run: yarn run build
