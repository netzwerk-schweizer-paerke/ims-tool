approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

enableTelemetry: false

logFilters:
  - code: YN0002
    level: discard
  - code: YN0007
    level: discard
  - code: YN0013
    level: discard
  - code: YN0060
    level: discard
  - code: YN0061
    level: discard

nmMode: hardlinks-local

nodeLinker: node-modules

npmMinimalAgeGate: 0

supportedArchitectures:
  cpu:
    - current
    - x64
  libc:
    - current
    - musl
  os:
    - current
    - linux

yarnPath: .yarn/releases/yarn-4.18.0.cjs
