services:
  postgres:
    image: postgres:16
    container_name: ims-tool-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swiss-parcs-ims
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # S3-compatible object storage. Credentials are not set here — the bucket and
  # API key are provisioned by scripts/garage-init.sh, which writes them to .env.
  garage:
    image: dxflrs/garage:v2.2.0
    container_name: ims-tool-garage
    restart: unless-stopped
    ports:
      - '3900:3900' # S3 API
      - '3903:3903' # admin API (no web console — Garage has none)
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage/data
      - garage-meta:/var/lib/garage/meta
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: ims-tool-mailpit
    restart: unless-stopped
    volumes:
      - mailpit-data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 100
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  mailpit-data:
    driver: local
  postgres-data:
    driver: local
  garage-data:
    driver: local
  garage-meta:
    driver: local
